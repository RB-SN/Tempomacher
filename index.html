:root[data-theme="dark"]{
  --bg:#0B1212; --surface:#141E1E; --sunk:#1D2928; --ink:#E6EFEE; --muted:#93A7A5; --line:#263433;
  --band:#0F3B3E; --on-band:#FFFFFF; --band-muted:#8EC3C0;
  --blue:#3BB5AC; --on-blue:#06201F; --hot:#FF6B70; --on-hot:#1A0607; --soft:#173130;
  --z1:#9AB0C4; --z2:#46C08A; --z3:#F0BE3C; --z4:#FF9550; --z5:#FF6680;
  --good:#46C08A; --warn:#F0BE3C; --bad:#FF6680;
  --brick:#D2684D; --mortar:#2B3433;
  --c1:#3BC2C2; --c2:#FF7A7E; --c3:#F2C14E; --c4:#A493FF; --c5:#54D193; --c6:#73A7F0; --c7:#F06292; --c8:#C9A98E;
  --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:50;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--blue);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}
.d{font-family:var(--display);font-weight:600;letter-spacing:-.01em;line-height:1.05}
.num{font-family:var(--display);font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.label{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px}
.hint{font-size:13.5px;color:var(--muted)}

/* header */
#hdr{background:var(--bg);position:sticky;top:env(safe-area-inset-top,0px);z-index:20;border-bottom:1px solid var(--line)}
.hdr-in{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.word{font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:-.01em;display:flex;align-items:center;gap:9px;color:var(--ink)}
.logo{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:9px;background:var(--band)}
.logo svg{width:18px;height:18px;fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
.hdr-meta{font-size:12.5px;color:var(--muted);text-align:right;line-height:1.35}
.hdr-meta .link{font-size:12.5px}
.demo-chip{border:0;background:var(--soft);color:var(--blue);font-weight:700;font-size:12px;padding:4px 10px;border-radius:999px;margin-bottom:3px}

.app{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 148px}

/* hero */
.hero{position:relative;overflow:hidden;color:var(--on-band);padding:18px 20px 18px;border-radius:var(--r);
  background:linear-gradient(135deg,var(--band) 0 55%,color-mix(in srgb,var(--band) 82%,#000) 100%)}
.hero .big{font-family:var(--display);font-weight:700;font-size:68px;line-height:.9;letter-spacing:-.03em}
.hero .lbl{font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:12px;color:var(--band-muted)}
.hero .race{font-family:var(--display);font-weight:600;font-size:clamp(17px,4.8vw,22px);line-height:1.15;overflow-wrap:anywhere}
.hero .sub{font-size:13.5px;color:var(--band-muted);margin-top:4px}
.hero-grid{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:end}
.hero-grid>div{min-width:0}
.trackbg{position:absolute;right:-70px;top:-40px;width:300px;height:190px;pointer-events:none}
.hero>*{position:relative}
.hero>.trackbg{position:absolute}
.herodet{margin-top:12px;border-top:1px solid rgba(255,255,255,.16);padding-top:10px;font-size:13.5px;color:var(--band-muted)}
.herodet summary{cursor:pointer;font-weight:700;color:var(--on-band);list-style:none;display:flex;align-items:center;gap:6px}
.herodet summary::-webkit-details-marker{display:none}
.herodet summary::after{content:"ⓘ";opacity:.75;font-weight:400}
.herodet p{margin:6px 0 0;line-height:1.45}
.progtrail{display:flex;align-items:flex-end;gap:6px;margin-top:14px}
.progtrail .trail{flex:1;min-width:0;height:30px}
.flag{width:24px;height:30px;color:var(--band-muted);flex:none}
.trail{display:block}
.lace{display:block;width:100%;height:auto}
.shoe{display:block;width:min(240px,70%);height:auto;margin:0 auto}
.authart{position:relative;padding:8px 0 0}
.authart .trail{width:56%;height:24px;margin:2px auto 0;opacity:.9}
.racestrip{height:10px;margin:-16px -16px 12px;border-radius:var(--r) var(--r) 0 0;background:repeating-conic-gradient(var(--ink) 0 25%,var(--surface) 0 50%) 0 0/10px 10px;opacity:.85}
.racestrip.main{background:repeating-conic-gradient(var(--hot) 0 25%,var(--surface) 0 50%) 0 0/10px 10px;opacity:1}
.sessprints{position:absolute;right:10px;bottom:6px;width:150px;height:24px;opacity:.5;pointer-events:none}
.prog{height:6px;border-radius:3px;background:rgba(255,255,255,.18);margin-top:16px;position:relative;overflow:hidden}
.prog b{position:absolute;inset:0 auto 0 0;background:var(--hot);border-radius:3px}
.prog-l{display:flex;justify-content:space-between;font-size:12px;color:var(--band-muted);margin-top:6px;font-weight:700}

/* section heads */
.sh{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px 10px;margin-top:8px}
.sh h2{font-family:var(--display);font-weight:600;font-size:21px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.sh h2::before{content:"";width:18px;height:22px;flex:none;background:var(--hot);-webkit-mask:var(--fp) center/contain no-repeat;mask:var(--fp) center/contain no-repeat}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.card h3{font-size:17px;font-weight:800;letter-spacing:-.005em}

/* session */
.sess{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.sess-top{background:var(--band);color:var(--on-band);padding:14px 18px 16px;position:relative}
.sess-k{position:relative;z-index:1;min-width:0}
.sess-km{font-family:var(--display);font-weight:700;font-size:58px;line-height:.95;letter-spacing:-.03em;display:flex;align-items:baseline;gap:6px;margin-top:4px}
.sess-km small{font-size:18px;font-weight:600;color:var(--band-muted);letter-spacing:0}
.sess-t{font-weight:800;font-size:19px;line-height:1.2;margin-top:6px}
.sess-tag{position:absolute;right:14px;top:14px;z-index:2;font-weight:800;font-size:13px;color:#fff;background:var(--zc,var(--blue));padding:4px 10px;border-radius:999px}
.sess-b{padding:14px 18px 18px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;font-size:13px;font-weight:700;background:var(--sunk);color:var(--ink);white-space:nowrap;border-radius:999px}
.pill.n{font-variant-numeric:tabular-nums}
.zp{color:#fff}
.Z1{background:var(--z1)}.Z2{background:var(--z2)}.Z3{background:var(--z3)}.Z4{background:var(--z4)}.Z5{background:var(--z5)}
ul.struct{margin:14px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
ul.struct li{display:grid;grid-template-columns:16px 1fr;gap:8px;font-size:15px}
ul.struct li::before{content:"";width:8px;height:8px;margin-top:7px;border-radius:50%;background:var(--hot)}
.note{font-size:14px;color:var(--muted);margin-top:10px;max-width:62ch}
.tagline{font-weight:800;font-size:12.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--hot);margin-top:4px}

/* buttons */
.btn{border:0;padding:12px 20px;font-weight:800;font-size:15px;background:var(--ink);color:var(--bg);display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;transition:transform .08s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--hot);color:var(--on-hot)}
.btn.blue{background:var(--blue);color:var(--on-blue)}
.btn.ghost{background:var(--sunk);color:var(--ink)}
.btn.small{padding:8px 14px;font-size:14px}
.btn.block{width:100%}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.danger{background:var(--bad);color:#fff}
.link{background:none;border:0;padding:0;color:var(--blue);font-weight:700;text-decoration:underline;text-underline-offset:3px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.opt{border:1.5px solid var(--line);background:var(--surface);padding:9px 14px;font-weight:700;font-size:14.5px;min-width:0;border-radius:999px}
.opt:disabled{opacity:.45;cursor:not-allowed}
.opt[aria-pressed="true"]{border-color:var(--blue);background:var(--blue);color:var(--on-blue)}
.opt.tall{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;padding:12px 14px;flex:1 1 150px;border-radius:var(--rs)}
.opt.tall b{font-size:15.5px;font-weight:800}
.opt.tall small{font-weight:500;font-size:13px;opacity:.85}
.opt.wide{flex:none;width:100%}

/* forms */
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.flabel{font-size:13.5px;font-weight:800}
.input{border:1.5px solid var(--line);background:var(--surface);padding:11px 13px;width:100%;min-width:0;border-radius:var(--rs)}
.input:focus{border-color:var(--blue);outline:none}
.tin{display:flex;gap:6px;align-items:center}
.tin .input{width:72px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--hot)}
input[type=checkbox]{accent-color:var(--blue);width:18px;height:18px}
.err{color:var(--bad);font-size:14px;font-weight:700}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:440px){.grid2{grid-template-columns:1fr}}
.live{background:var(--soft);padding:12px 14px;font-size:14px;border-radius:var(--rs)}

/* onboarding + login */
.lap{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.lap i{height:6px;border-radius:3px;background:var(--line)}
.lap i.on{background:var(--blue)}
.ob-h{overflow-wrap:anywhere;font-family:var(--display);font-weight:600;font-size:clamp(26px,8vw,36px);line-height:1.05;letter-spacing:-.02em}
.auth{max-width:440px;margin:6vh auto 0}
.auth-tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--sunk);border-radius:999px;padding:4px}
.auth-tabs button{border:0;background:none;padding:9px;border-radius:999px;font-weight:800;color:var(--muted)}
.auth-tabs button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* lanes */
.lane{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.dchip{border:1px solid var(--line);background:var(--surface);padding:7px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0;border-radius:var(--rs);position:relative;overflow:hidden}
.dchip::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--zc,transparent)}
.dchip .dn{font-size:11.5px;font-weight:700;color:var(--muted)}
.dchip .dd{font-family:var(--display);font-weight:600;font-size:16px;line-height:1.2}
.dchip .kk{font-size:11.5px;font-weight:700;color:var(--muted);height:16px}
.dchip.today{background:var(--band);color:var(--on-band);border-color:var(--band)}
.dchip.today .dn,.dchip.today .kk{color:var(--band-muted)}
.dchip.past{opacity:.55}
.dchip .ok{color:var(--good)}
.dchip.today .ok{color:#7FE3B5}
.lane-l{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:2px 0 6px}

/* banners */
.banner{padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);position:relative;padding-left:20px;box-shadow:var(--shadow)}
.banner::before{content:"";position:absolute;left:8px;top:14px;bottom:14px;width:4px;border-radius:2px;background:var(--muted)}
.banner.up::before{background:var(--good)}.banner.down::before{background:var(--warn)}
.verdict{font-weight:800;font-size:16px;display:flex;gap:8px;align-items:center}
.notes{margin:8px 0 0;padding-left:18px;font-size:14.5px}
.notes li{margin-bottom:3px}
.adj{background:var(--soft);border-radius:var(--r);padding:12px 14px;font-size:14.5px}
.todayc{display:flex;flex-direction:column;gap:6px;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow)}
.trash{border:0;background:var(--sunk);width:34px;height:34px;border-radius:50%;display:inline-grid;place-items:center;flex:none;color:var(--muted)}
.trash:hover{background:color-mix(in srgb,var(--bad) 14%,var(--surface));color:var(--bad)}
.trash.pen:hover{background:var(--soft);color:var(--blue)}
.trash svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.todayc b{font-size:17px;font-weight:800}
.restshoe svg{width:40px;height:40px;stroke:var(--blue);fill:var(--soft);stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round;display:block}
.tomorrow{background:var(--soft);border-radius:var(--r);padding:14px 16px;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;border:0;width:100%;text-align:left}
.tomorrow .ic{width:40px;height:40px;border-radius:12px;background:var(--band);display:grid;place-items:center}
.tomorrow .ic svg{width:22px;height:22px;stroke:var(--on-band);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* lists */
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.li{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:11px 14px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.li:last-child{border-bottom:0}
.li .dt{font-size:12px;font-weight:700;color:var(--muted);line-height:1.1;text-align:center}
.li .dt b{display:block;font-family:var(--display);font-weight:600;font-size:17px;color:var(--ink)}
.li .t{font-weight:700;min-width:0}
.li .t small{display:block;font-weight:500;color:var(--muted);font-size:13px}
.li .k{font-weight:800;font-size:15px;text-align:right;font-variant-numeric:tabular-nums}
.li.isToday{background:var(--soft)}
.zbar{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:1px}

/* plan weeks */
.wk{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.wk-h{display:grid;grid-template-columns:1fr auto;gap:8px;width:100%;padding:13px 16px;background:none;border:0;text-align:left;align-items:center}
.wk-h .wn{font-family:var(--display);font-weight:600;font-size:17px;line-height:1.1}
.wk-b{border-top:1px solid var(--line)}
.wk-b .list{border:0;border-radius:0;box-shadow:none}
.wk.cur{border:2px solid var(--blue)}
.wk.far .wk-h{cursor:default}
.ph{font-size:11.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:3px 9px;color:#fff;background:var(--muted);border-radius:999px;white-space:nowrap}
.ph-gen,.ph-recover{background:var(--z1)}.ph-base{background:var(--z2)}.ph-build{background:var(--blue)}.ph-peak{background:var(--hot)}.ph-taper{background:var(--z3)}.ph-rec{background:var(--sunk);color:var(--ink)}
.divider{display:flex;align-items:center;gap:10px;font-size:12.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--hot);margin-top:6px}
.divider::before,.divider::after{content:"";flex:1;height:2px;border-radius:1px;background:var(--hot);opacity:.5}

table.t{width:100%;border-collapse:collapse;font-size:14.5px}
table.t th{text-align:left;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:800;padding:6px;border-bottom:1.5px solid var(--line)}
table.t td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:top}
table.t tr:last-child td{border-bottom:0}
table.t td.n{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.scroll-x{overflow-x:auto}

/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;box-shadow:var(--shadow)}
.stat .v{font-family:var(--display);font-weight:600;font-size:30px;line-height:1.1;letter-spacing:-.02em}
.stat .h{font-size:12.5px;color:var(--muted)}

/* PB */
.impbox{background:var(--soft);border-radius:var(--r);padding:12px 14px;font-size:14px;display:flex;flex-direction:column;gap:3px}
.help summary{cursor:pointer;font-weight:800;color:var(--blue);font-size:14px}
.help ul{margin-top:6px}
.pbl{display:flex;flex-direction:column;margin-top:8px}
.pbrow{display:grid;grid-template-columns:12px 1fr auto 12px;gap:12px;align-items:center;padding:12px 2px;border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%}
.pbrow:first-child{border-top:0}
.pbrow .sw{width:10px;height:10px}
.pbd,.pbt{display:flex;flex-direction:column;min-width:0}
.pbd b{font-weight:800}
.pbd small,.pbt small{font-size:12.5px;color:var(--muted)}
.pbt{text-align:right}
.pbt b{font-family:var(--display);font-weight:600;font-size:18px;font-variant-numeric:tabular-nums}
.pbg{padding:12px 0;border-top:1px solid var(--line)}
.pbg:first-of-type{border-top:0}
.pbg-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px}
.pbg-b{display:flex;flex-direction:column;align-items:flex-end;gap:1px}
.pbg-b b{font-family:var(--display);font-weight:600;font-size:16px;font-variant-numeric:tabular-nums}
.pbg-d{font-size:12.5px;font-weight:800;color:var(--good);white-space:nowrap}
.pbbars{display:flex;flex-direction:column;gap:6px}
.pbbar{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;font-size:13px}
.pbbar-dt{color:var(--muted);font-weight:600;min-width:52px;white-space:nowrap}
.pbbar-tr{height:10px;border-radius:5px;background:var(--sunk);overflow:hidden;min-width:0}
.pbbar-tr i{display:block;height:100%;border-radius:5px;opacity:.55}
.pbbar.best .pbbar-tr i{opacity:1}
.pbbar-t{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap;text-align:right;min-width:56px}
.pbbar.best .pbbar-t{color:var(--ink);font-weight:800}
.pbx{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.pbx:first-of-type{border-top:0}
.pbx svg{display:block;max-width:28vw;height:auto}
.pbx .tm{font-family:var(--display);font-weight:600;font-size:15px;font-variant-numeric:tabular-nums}
@media (max-width:380px){.pbx{grid-template-columns:1fr auto}.pbx svg{grid-column:1/-1;grid-row:2;max-width:100%;width:100%}}
.pbg{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
.pbg:first-of-type{border-top:0;margin-top:4px;padding-top:0}
.pbh{display:flex;align-items:center;gap:8px;font-weight:800}
.pbh .sw{width:12px;height:12px;border-radius:50%}
.pbr{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:7px 4px;border:0;background:none;width:100%;text-align:left;border-radius:10px}
.pbr:hover{background:var(--sunk)}
.pbr .tm{font-weight:800;font-variant-numeric:tabular-nums}
.pbr small{color:var(--muted);font-size:12.5px}
.pbtag{font-size:11px;font-weight:800;background:var(--hot);color:var(--on-hot);padding:2px 7px;border-radius:999px}

.rpe-val{font-family:var(--display);font-weight:700;font-size:44px;line-height:1;color:var(--hot)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(5,20,20,.45);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:90%;overflow-y:auto;background:var(--bg);border-radius:24px 24px 0 0;padding-block:10px calc(24px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet-in{max-width:660px;margin:0 auto}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
nav.tabs .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{background:none;border:0;min-height:80px;padding:10px 2px 12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:14px;font-weight:800;color:var(--muted);cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
nav.tabs button svg{width:38px;height:38px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;padding:2px;border-radius:10px}
nav.tabs button[aria-current="page"]{color:var(--blue)}
nav.tabs button[aria-current="page"] svg{background:var(--soft);width:62px}
@media (max-width:360px){nav.tabs button{font-size:12.5px}nav.tabs button svg{width:34px;height:34px}nav.tabs button[aria-current="page"] svg{width:54px}}

/* charts */
.chart{width:100%;height:auto;display:block}
.walls{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;align-items:end}
@media (max-width:560px){.walls{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 8px}}
.wallw{display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 5px 6px;border-radius:12px;min-width:0}
.wallw svg{display:block;width:100%;height:auto}
.wallw.cur{background:var(--soft)}
.wl{font-size:11.5px;font-weight:700;color:var(--muted)}
.wallw.cur .wl{color:var(--ink)}
.wk2{font-family:var(--display);font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:-2px}
.wk2 .muted{font-size:12.5px}
.chart text{font-family:var(--body);font-weight:600;font-size:11px;fill:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;display:inline-block;border-radius:3px}
.langsw{display:flex;gap:2px;align-self:flex-end;background:var(--sunk);border-radius:999px;padding:3px}
.langsw button{border:0;background:none;font:inherit;font-size:12.5px;font-weight:800;letter-spacing:.06em;color:var(--muted);padding:6px 12px;border-radius:999px;cursor:pointer;min-height:32px}
.langsw button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.fb{display:flex;flex-direction:column;gap:10px}
.fbh{display:flex;align-items:center;gap:14px}
.fbs{flex:none;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;align-content:center;border:5px solid var(--sc);font-family:var(--display);line-height:1}
.fbs b{font-size:24px;font-weight:700}.fbs small{font-size:11px;color:var(--muted);font-family:var(--body);font-weight:700}
.fbt{font-weight:800;font-size:16.5px}
.fbl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.fbl li{display:grid;grid-template-columns:22px 1fr;gap:6px;font-size:14.5px;line-height:1.45}
.fbl li span{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;font-weight:800;font-size:13px;margin-top:1px}
.fbl.pl li span{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.fbl.mi li span{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.fbl.tp li span{background:var(--soft);color:var(--blue)}
.fbk{font-size:12.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.fbtab{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.fbtab th{font-size:12px;color:var(--muted);font-weight:700;text-align:right;padding:0 0 4px}
.fbtab td{padding:5px 0;border-top:1px solid var(--line);text-align:right;white-space:nowrap}
.fbtab td:first-child,.fbtab th:first-child{text-align:left;color:var(--muted);white-space:normal}
.fbtab td:nth-child(2){font-weight:800}
.fbc{margin:0;font-size:14px;color:var(--muted);line-height:1.5}.fbc b{color:var(--ink)}
.todayc.done{display:flex;flex-direction:column;gap:8px;cursor:default}
.todone{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:10px 0 2px;font:inherit;color:inherit;cursor:pointer}
.todone:first-of-type{border-top:0;padding-top:2px}
.todone-t{display:flex;flex-direction:column;gap:3px;min-width:0}.todone-t b{font-size:17px}
.todone-m{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.fbs.mini{width:44px;height:44px;border-width:4px}.fbs.mini b{font-size:17px}
.shs{border:1px solid var(--line);border-radius:var(--rs);padding:12px 14px;background:var(--surface)}
.shs.hot{border:2px solid var(--hot)}
.shs-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.shs-h b{font-size:15.5px}
.shs-n{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--band);color:var(--on-band);font-weight:800;font-size:13px;flex:none}
.shs p{margin:6px 0 4px;font-size:14px;color:var(--muted);line-height:1.45}
.shs ul{margin:0;padding-left:20px;font-size:14px;line-height:1.5}
.copy{margin-top:28px;padding-top:14px;border-top:1px solid var(--line);text-align:center;font-size:12.5px;color:var(--muted)}
.coach-out{white-space:pre-wrap;font-size:15px;max-width:62ch}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style>
</head>
